# Publica site/ en public_html de gebrey.es por FTP (cPanel no tiene Git Version Control en este servidor).
# Necesita tres secretos en GitHub: FTP_HOST, FTP_USER y FTP_PASSWORD.
name: Publicar gebrey.es

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar site/ con public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: site/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
